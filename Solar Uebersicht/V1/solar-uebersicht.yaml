      svg: "[[[ const v = variables; const mob = v.m; const mode = v.st('select.victron_vebus_mode_227').toUpperCase(); const fc = v.st('switch.ess_force_charge') === 'on'; const act = v.num('number.gx_device_ess_max_ladestrom'); const tgt = v.num('input_number.solar_ziel_ladestrom'); const cur = isNaN(tgt) ? act : tgt; const pend = !isNaN(tgt) && !isNaN(act) && Math.round(tgt) !== Math.round(act); const va = 'sensor.victron_vebus_alarm_'; const ids = ['overload', 'lowbattery', 'hightemperature', 'temperaturesensor', 'voltagesensor', 'phaserotation', 'l1_overload', 'l2_overload', 'l3_overload', 'l1_lowbattery', 'l2_lowbattery', 'l3_lowbattery', 'l1_higtemperature', 'l2_higtemperature', 'l3_higtemperature', 'l1_ripple', 'l2_ripple', 'l3_ripple']; const al = ids.map(i => v.st(va + i + '_227').toUpperCase()); const err = v.st('sensor.victron_vebus_error_227').toUpperCase(); const lvl = (al.includes('ALARM') || !['OK', 'UNKNOWN', 'UNAVAILABLE', '0'].includes(err)) ? 2 : (al.includes('WARNING') ? 1 : 0); const W = mob ? 400 : 960; let b = ''; b += v.T(16, 14, mob ? 'MultiPlus-System' : 'Steuerung MultiPlus-System (L1 – L3)', mob ? 16 : 18, '#FFFFFF', 'start', 700); b += v.BELL(W - 26, 22, lvl); b += v.T(W - 42, 15, lvl === 2 ? 'Alarm' : (lvl === 1 ? 'Warnung' : 'Kein Alarm'), 12, lvl === 2 ? '#E5484D' : (lvl === 1 ? '#F7AB3E' : '#5DBE6E'), 'end', 700); const modes = [['ON', 'Ein'], ['CHARGER', 'Nur Laden'], ['INVERTER', 'Nur WR'], ['OFF', 'Aus']]; const seg = (x, y, w, h, k, label) => { const act = mode === k; const col = k === 'OFF' ? '#E5484D' : '#387DC5'; b += v.R(x, y, w, h, 10, act ? col : '#18293B', act ? col : '#24384E', act ? 0 : 1); b += v.T(x + w / 2, y + h / 2 - 8, label, 15, act ? '#FFFFFF' : '#9FB3C8', 'middle', 700); }; const tog = (x, y, w, h) => { b += v.R(x, y, w, h, 10, '#18293B', fc ? '#F7AB3E' : '#24384E', fc ? 2 : 1); b += v.T(x + 14, y + h / 2 - 8, 'Aus dem Netz laden', 15, fc ? '#F7AB3E' : '#FFFFFF', 'start', 700); const tx = x + w - 62; b += v.R(tx, y + h / 2 - 12, 48, 24, 12, fc ? '#F7AB3E' : '#2B4560'); b += v.C(fc ? tx + 36 : tx + 12, y + h / 2, 9, '#FFFFFF'); }; const cbar = (x, y, w, h) => { b += v.R(x, y, w, h, h / 2, '#18293B', '#24384E', 1); if (!isNaN(cur) && cur > 0) b += v.R(x, y, Math.max(h, w * Math.min(1, cur / 400)), h, h / 2, pend ? '#F7AB3E' : '#387DC5'); b += v.T(x + w / 2, y + h / 2 - 11, 'Max. Ladestrom ' + (isNaN(cur) ? '--' : (cur < 0 ? 'unbegrenzt' : Math.round(cur) + ' A')) + (pend ? (mob ? ' …' : ' · wird übernommen …') : ''), mob ? 18 : 22, '#FFFFFF', 'middle', 700); [['-', x + 4], ['+', x + w - 4 - (h - 4)]].forEach(([sg, xx]) => { b += v.R(xx, y + 2, h - 4, h - 4, (h - 4) / 2, '#0F1A26', '#8FA3B5', 2); const cx = xx + (h - 4) / 2, cy = y + h / 2, a = 7; b += `<line x1='${cx - a}' y1='${cy}' x2='${cx + a}' y2='${cy}' stroke='#FFFFFF' stroke-width='2.5' stroke-linecap='round'/>`; if (sg === '+') b += `<line x1='${cx}' y1='${cy - a}' x2='${cx}' y2='${cy + a}' stroke='#FFFFFF' stroke-width='2.5' stroke-linecap='round'/>`; }); }; if (!mob) { modes.forEach(([k, l], i) => seg(20 + i * 126, 48, 120, 40, k, l)); tog(560, 48, 380, 40); cbar(20, 100, 920, 40); return v.SVG(960, 156, b); } modes.forEach(([k, l], i) => seg(16 + (i % 2) * 190, 44 + Math.floor(i / 2) * 46, 178, 40, k, l)); tog(16, 140, 368, 40); cbar(16, 192, 368, 38); return v.SVG(400, 244, b); ]]]"
