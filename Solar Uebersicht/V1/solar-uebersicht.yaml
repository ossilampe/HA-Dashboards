button_card_templates:
  vic_base:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    variables:
      m: false
      num: "[[[ return (e) => { const s = states[e]; return s ? parseFloat(s.state) : NaN; }; ]]]"
      st: "[[[ return (e) => states[e] ? String(states[e].state) : 'unknown'; ]]]"
      f: "[[[ const num = variables.num; return (e, d, u, pre) => { const n = num(e); return (pre || '') + (isNaN(n) ? '--' : n.toFixed(d).replace('.', ',')) + (u || ''); }; ]]]"
      W: "[[[ return (n) => isNaN(n) ? '-- W' : (Math.abs(n) >= 1000 ? (n / 1000).toFixed(2).replace('.', ',') + ' kW' : Math.round(n) + ' W'); ]]]"
      sum: "[[[ const num = variables.num; return (ids) => { let t = 0, ok = false; ids.forEach(e => { const n = num(e); if (!isNaN(n)) { t += n; ok = true; } }); return ok ? t : NaN; }; ]]]"
      DE: "[[[ const m = {OFF:'Aus', LOW_POWER:'Energiesparen', FAULT:'Fehler', BULK:'Bulk', ABSORPTION:'Absorption', FLOAT:'Float', STORAGE:'Erhaltung', EQUALIZE:'Ausgleich', PASSTHRU:'Durchleitung', INVERTING:'Wechselrichten', POWER_ASSIST:'Power Assist', POWER_SUPPLY:'Netzteil', EXTERNAL_CONTROL:'Extern', IDLE:'Ruhe', CHARGING:'Lädt', DISCHARGING:'Entlädt', UNAVAILABLE:'offline', UNKNOWN:'--'}; return (s) => { const k = String(s || '').toUpperCase(); return m[k] || s; }; ]]]"
      T: "[[[ return (x, y, s, size, col, a, w) => `<text x='${x}' y='${y}' font-size='${size}' fill='${col || '#FFFFFF'}' text-anchor='${a || 'start'}' dominant-baseline='hanging' font-weight='${w || 400}'>${s}</text>`; ]]]"
      R: "[[[ return (x, y, w, h, r, fill, stroke, sw) => `<rect x='${x}' y='${y}' width='${w}' height='${h}' rx='${r}' fill='${fill}' stroke='${stroke || 'none'}' stroke-width='${sw || 0}'/>`; ]]]"
      C: "[[[ return (cx, cy, r, fill) => `<circle cx='${cx}' cy='${cy}' r='${r}' fill='${fill}'/>`; ]]]"
      PILL: "[[[ const R = variables.R, T = variables.T; return (xr, y, txt, bg, fg) => { const w = String(txt).length * 7.6 + 22; return R(xr - w, y, w, 24, 12, bg) + T(xr - w / 2, y + 6, txt, 12, fg, 'middle', 700); }; ]]]"
      SVG: "[[[ return (w, h, body) => `<svg viewBox='0 0 ${w} ${h}' width='100%' style='display:block' font-family='Roboto, Arial, sans-serif' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='${w}' height='${h}' fill='#0F1A26'/>` + body + `</svg>`; ]]]"
      BOX: "[[[ const R = variables.R, T = variables.T; return (x, y, w, h, col, title, big, bigCol, subs, mob) => { const z = mob ? {t: 12, hh: 26, b: 22, by: 34, s: 11, sy: 64, sl: 16} : {t: 13, hh: 28, b: 26, by: 38, s: 12, sy: 76, sl: 18}; let s = R(x, y, w, h, 12, '#18293B', '#24384E', 1) + R(x, y, w, z.hh, 12, col) + R(x, y + z.hh - 12, w, 12, 0, col) + T(x + 12, y + 7, title, z.t, '#0F1A26', 'start', 700) + T(x + 12, y + z.by, big, z.b, bigCol, 'start', 700); (subs || []).forEach((t, k) => { if (t) s += T(x + 12, y + z.sy + k * z.sl, t, z.s, '#9FB3C8'); }); return s; }; ]]]"
      FLOW: "[[[ return (d, pw, col) => { let s = `<path d='${d}' fill='none' stroke='#2B4560' stroke-width='3' stroke-linejoin='round'/>`; if (isNaN(pw) || Math.abs(pw) < 5) return s; const dur = Math.max(0.8, Math.min(4, 4.5 - Math.log10(Math.abs(pw)))).toFixed(2); const kp = pw >= 0 ? '0;1' : '1;0'; for (let k = 0; k < 3; k++) s += `<circle r='4.5' fill='${col}'><animateMotion dur='${dur}s' begin='-${(k * dur / 3).toFixed(2)}s' repeatCount='indefinite' path='${d}' keyPoints='${kp}' keyTimes='0;1' calcMode='linear'/></circle>`; return s; }; ]]]"
      MPPT: "[[[ const R = variables.R, T = variables.T, C = variables.C; return (x, y, on, led) => { let b = R(x, y, 110, 150, 10, '#1D5FAE', '#2F78CC', 1); for (let i = 0; i < 9; i++) b += R(x + 9 + i * 10.4, y + 8, 5, 52, 2, '#164B8C'); b += R(x + 10, y + 68, 90, 44, 4, '#0B0F14'); b += T(x + 55, y + 75, 'victron energy', 9, '#FFFFFF', 'middle', 700); b += T(x + 55, y + 89, 'SmartSolar', 8, '#9FB6CF', 'middle'); b += T(x + 55, y + 99, 'MPPT', 8, '#9FB6CF', 'middle'); b += C(x + 92, y + 105, 3, on ? led : '#2A3440'); b += R(x + 8, y + 118, 94, 24, 4, '#2A2F36'); for (let i = 0; i < 4; i++) b += C(x + 22 + i * 22, y + 130, 5, '#8A939C'); return b; }; ]]]"
      MULTI: "[[[ const R = variables.R, T = variables.T, C = variables.C; return (x, y, mains, inv, chg) => { let b = R(x, y, 120, 190, 10, '#1D5FAE', '#2F78CC', 1); b += R(x + 8, y + 8, 104, 72, 6, '#E8EDF2'); b += T(x + 60, y + 16, 'victron energy', 10, '#1D5FAE', 'middle', 700); b += T(x + 60, y + 32, 'MultiPlus-II', 10, '#2A3440', 'middle', 600); [[mains, '#3CCF5A'], [inv, '#3CCF5A'], [chg, '#F7AB3E']].forEach(([on, c], i) => { b += C(x + 34 + i * 26, y + 58, 4.5, on ? c : '#B8C2CC'); }); b += T(x + 34, y + 66, 'Netz', 6, '#5A6672', 'middle'); b += T(x + 60, y + 66, 'WR', 6, '#5A6672', 'middle'); b += T(x + 86, y + 66, 'Laden', 6, '#5A6672', 'middle'); for (let i = 0; i < 10; i++) b += R(x + 14, y + 92 + i * 8, 92, 3, 1.5, '#164B8C'); b += R(x + 8, y + 174, 104, 10, 3, '#0B0F14'); return b; }; ]]]"
      MODULE: "[[[ const R = variables.R, T = variables.T, C = variables.C; return (x, y, w, n, soc, socTxt) => { let b = R(x, y, w, 28, 3, '#F2F4F6', '#C9D0D6', 1); b += R(x + 6, y + 6, 34, 16, 2, '#20262D'); b += T(x + 23, y + 9, String(n), 10, '#FFFFFF', 'middle', 700); b += T(x + 48, y + 9, (w < 220 ? '' : 'Pylontech ') + (n <= 2 ? 'US5000' : 'US2000'), 10, '#3A4A5A', 'start', 700); if (socTxt && w >= 220) b += T(x + w - 72, y + 9, socTxt, 10, '#3A4A5A', 'end', 600); const lit = isNaN(soc) ? 0 : Math.ceil(soc / 25); for (let k = 0; k < 4; k++) b += C(x + w - 60 + k * 11, y + 14, 3.5, k < lit ? '#3CCF5A' : '#C9D0D6'); b += C(x + w - 12, y + 14, 4, isNaN(soc) ? '#C9D0D6' : '#3CCF5A'); return b; }; ]]]"
      BELL: "[[[ return (cx, cy, lvl) => { const col = lvl === 2 ? '#E5484D' : (lvl === 1 ? '#F7AB3E' : (lvl === 0 ? '#5DBE6E' : '#6E8399')); const an = lvl >= 1 ? `<animate attributeName='opacity' values='1;0.25;1' dur='1s' repeatCount='indefinite'/>` : ''; return `<g fill='${col}'>${an}<path d='M${cx - 7},${cy + 4} L${cx + 7},${cy + 4} L${cx + 5},${cy + 1} L${cx + 5},${cy - 3} A5,5 0 0 0 ${cx - 5},${cy - 3} L${cx - 5},${cy + 1} Z'/><circle cx='${cx}' cy='${cy + 6.5}' r='1.8'/><circle cx='${cx}' cy='${cy - 8.3}' r='1.3'/></g>`; }; ]]]"
      PWR: "[[[ const R = variables.R; return (x, y, on) => { const col = on ? '#5DBE6E' : '#E5484D'; const cx = x + 20, cy = y + 13; return R(x, y, 40, 24, 12, '#0F1A26', col, 2) + `<path d='M${cx - 4.4},${cy - 4.4} A6.2,6.2 0 1 0 ${cx + 4.4},${cy - 4.4}' fill='none' stroke='${col}' stroke-width='2' stroke-linecap='round'/><line x1='${cx}' y1='${cy - 8}' x2='${cx}' y2='${cy - 1}' stroke='${col}' stroke-width='2' stroke-linecap='round'/>`; }; ]]]"
    styles:
      card:
        - background-color: "#0F1A26"
        - padding: "0"
        - border-radius: 14px
        - overflow: hidden
        - border: "1px solid #1F3247"
      grid:
        - grid-template-areas: "\"svg\""
        - grid-template-columns: 1fr
        - grid-template-rows: auto
      custom_fields:
        svg:
          - width: 100%
          - line-height: "0"
    extra_styles: "#soc_minus, #soc_plus { display: block !important; } #soc_minus > *, #soc_plus > * { display: block; width: 100% !important; min-width: 100%; height: 100%; cursor: pointer; } [id^='t_'] { display: block !important; } [id^='t_'] > * { display: block; width: 100% !important; min-width: 100%; height: 100%; cursor: pointer; }"
  vic_flow:
    template: vic_base
    triggers_update:
      - sensor.gx_device_netz_leistung_l1
      - sensor.gx_device_netz_leistung_l2
      - sensor.gx_device_netz_leistung_l3
      - sensor.gx_device_verbrauch_leistung_l1
      - sensor.gx_device_verbrauch_leistung_l2
      - sensor.gx_device_verbrauch_leistung_l3
      - sensor.victron_system_dc_pv_power
      - sensor.gx_device_solar_erzeugung_taglich
      - sensor.victron_system_battery_power
      - sensor.victron_system_battery_soc
      - sensor.victron_system_battery_voltage
      - sensor.victron_system_battery_current
      - sensor.victron_system_battery_state
      - sensor.victron_system_battery_time_to_go
      - sensor.victron_vebus_state_227
      - sensor.gx_device_systemzustand_2
      - sensor.multiplus_ii_1_wechselrichter_dc_leistung
      - sensor.gx_device_dc_verbrauch_2
      - sensor.multiplus_ii_1_ve_bus_gerat_0_inverter_leistung
      - sensor.multiplus_ii_1_ve_bus_gerat_1_inverter_leistung
      - sensor.multiplus_ii_1_ve_bus_gerat_2_inverter_leistung
    custom_fields:
      svg: "[[[ const v = variables; const mob = v.m; const g = ['l1', 'l2', 'l3']; const grid = v.sum(g.map(p => 'sensor.gx_device_netz_leistung_' + p)); const load = v.sum(g.map(p => 'sensor.gx_device_verbrauch_leistung_' + p)); const pv = v.num('sensor.victron_system_dc_pv_power'); const bat = v.num('sensor.victron_system_battery_power'); const soc = v.num('sensor.victron_system_battery_soc'); const mdc = v.num('sensor.multiplus_ii_1_wechselrichter_dc_leistung'); const dcl = v.num('sensor.gx_device_dc_verbrauch_2'); const inv = v.sum([0, 1, 2].map(i => 'sensor.multiplus_ii_1_ve_bus_gerat_' + i + '_inverter_leistung')); const ttg = v.num('sensor.victron_system_battery_time_to_go'); const ttgTxt = !isNaN(ttg) && ttg > 0 ? Math.floor(ttg / 3600) + ' h ' + Math.round((ttg % 3600) / 60) + ' min' : '--'; const socCol = isNaN(soc) ? '#FFFFFF' : (soc < 20 ? '#E5484D' : (soc < 50 ? '#F7AB3E' : '#5DBE6E')); const ph = (pre) => g.map(p => p.toUpperCase() + ' ' + Math.round(v.num(pre + p) || 0) + ' W').join(' · '); const gridSub = [!isNaN(grid) && grid < 0 ? 'Einspeisung' : 'Bezug', ph('sensor.gx_device_netz_leistung_')]; const multiSub = ['Wechselrichter ' + v.W(inv), 'ESS: ' + v.st('sensor.gx_device_systemzustand_2').replace('_', ' ')]; const batSub = [v.W(bat) + ' · ' + v.f('sensor.victron_system_battery_voltage', 1, ' V') + ' · ' + v.f('sensor.victron_system_battery_current', 1, ' A'), v.DE(v.st('sensor.victron_system_battery_state')) + ' · Rest ' + ttgTxt]; const socTxt = isNaN(soc) ? '-- %' : Math.round(soc) + ' %'; const vb = v.DE(v.st('sensor.victron_vebus_state_227')); let b = ''; if (!mob) { b += `<path d='M120,190 L840,190' fill='none' stroke='#2B4560' stroke-width='3'/>`; b += v.FLOW('M220,80 L380,80', grid, '#9FB3C8'); b += v.FLOW('M580,80 L740,80', load, '#4AB9C1'); b += v.FLOW('M480,140 L480,190', mdc, '#387DC5'); b += v.FLOW('M120,190 L120,230', bat, '#5DBE6E'); b += v.FLOW('M480,230 L480,190', pv, '#F7AB3E'); b += v.FLOW('M840,190 L840,230', dcl, '#C58AE0'); b += v.BOX(20, 20, 200, 120, '#9FB3C8', 'NETZ', v.W(grid), '#FFFFFF', gridSub); b += v.BOX(380, 20, 200, 120, '#387DC5', 'MULTIPLUS-II × 3', vb, '#FFFFFF', multiSub); b += v.BOX(740, 20, 200, 120, '#4AB9C1', 'AC-VERBRAUCHER', v.W(load), '#FFFFFF', [ph('sensor.gx_device_verbrauch_leistung_')]); b += v.BOX(20, 230, 200, 120, socCol, 'BATTERIE', socTxt, socCol, batSub); b += v.BOX(380, 230, 200, 120, '#F7AB3E', 'SOLAR (MPPT × 3)', v.W(pv), '#F7AB3E', ['Heute ' + v.f('sensor.gx_device_solar_erzeugung_taglich', 2, ' kWh')]); b += v.BOX(740, 230, 200, 120, '#C58AE0', 'DC-VERBRAUCHER', v.W(dcl), '#FFFFFF', []); return v.SVG(960, 370, b); } b += `<path d='M105,305 L295,305' fill='none' stroke='#2B4560' stroke-width='3'/>`; b += v.FLOW('M105,130 L105,225 L115,225', grid, '#9FB3C8'); b += v.FLOW('M285,225 L295,225 L295,130', load, '#4AB9C1'); b += v.FLOW('M200,280 L200,305', mdc, '#387DC5'); b += v.FLOW('M105,305 L105,330', bat, '#5DBE6E'); b += v.FLOW('M295,330 L295,305', pv, '#F7AB3E'); b += v.BOX(20, 20, 170, 110, '#9FB3C8', 'NETZ', v.W(grid), '#FFFFFF', gridSub, true); b += v.BOX(210, 20, 170, 110, '#4AB9C1', 'AC-VERBRAUCHER', v.W(load), '#FFFFFF', [ph('sensor.gx_device_verbrauch_leistung_')], true); b += v.BOX(115, 170, 170, 110, '#387DC5', 'MULTIPLUS-II × 3', vb, '#FFFFFF', multiSub, true); b += v.BOX(20, 330, 170, 110, socCol, 'BATTERIE', socTxt, socCol, batSub, true); b += v.BOX(210, 330, 170, 110, '#F7AB3E', 'SOLAR (MPPT × 3)', v.W(pv), '#F7AB3E', ['Heute ' + v.f('sensor.gx_device_solar_erzeugung_taglich', 2, ' kWh')], true); b += v.R(20, 456, 360, 44, 12, '#18293B', '#24384E', 1) + v.R(20, 456, 6, 44, 3, '#C58AE0') + v.T(38, 471, 'DC-VERBRAUCHER', 12, '#9FB3C8', 'start', 700) + v.T(366, 467, v.W(dcl), 20, '#FFFFFF', 'end', 700); return v.SVG(400, 516, b); ]]]"
  vic_energy:
    template: vic_base
    triggers_update:
      - sensor.gx_device_solar_erzeugung_taglich
      - sensor.vrm_today_grid_energy_in
      - sensor.vrm_today_grid_energy_out
      - sensor.vrm_today_consumption
      - sensor.strom_strombezug_ebz_inop
      - sensor.strom_strom_einspeisung_ebz_outop_taglich
      - sensor.verbrauch_energie_heute
      - sensor.gx_device_batterie_in
      - sensor.gx_device_baterie_out
      - sensor.stromleser_ebz_e_inop
      - sensor.stromleser_ebz_e_outop
    custom_fields:
      svg: "[[[ const v = variables; const mob = v.m; const pick = (a, b) => { const n = v.num(a); return isNaN(n) ? v.num(b) : n; }; const solar = v.num('sensor.gx_device_solar_erzeugung_taglich'); const gin = pick('sensor.vrm_today_grid_energy_in', 'sensor.strom_strombezug_ebz_inop'); const gout = pick('sensor.vrm_today_grid_energy_out', 'sensor.strom_strom_einspeisung_ebz_outop_taglich'); const cons = pick('sensor.vrm_today_consumption', 'sensor.verbrauch_energie_heute'); const bin = v.num('sensor.gx_device_batterie_in'); const bout = v.num('sensor.gx_device_baterie_out'); const k = (n) => isNaN(n) ? '--' : n.toFixed(n < 10 ? 2 : 1).replace('.', ','); const pct = (n) => isNaN(n) ? '--' : Math.round(Math.max(0, Math.min(100, n))) + ' %'; const aut = (!isNaN(cons) && cons > 0 && !isNaN(gin)) ? (1 - gin / cons) * 100 : NaN; const eig = (!isNaN(solar) && solar > 0 && !isNaN(gout)) ? (1 - gout / solar) * 100 : NaN; const tiles = [['SOLAR ERZEUGT', solar, '#F7AB3E', 'Eigenverbrauch ' + pct(eig)], ['EINGESPEIST', gout, '#9FB3C8', 'ins Netz'], ['AUS DEM NETZ', gin, '#E07A5F', 'Netzbezug'], ['GESAMTVERBRAUCH', cons, '#4AB9C1', 'Autarkie ' + pct(aut)], ['IN DEN AKKU', bin, '#5DBE6E', 'geladen'], ['AUS DEM AKKU', bout, '#C58AE0', 'entladen']]; const zb = v.num('sensor.stromleser_ebz_e_inop'); const ze = v.num('sensor.stromleser_ebz_e_outop'); const fz = (n) => isNaN(n) ? '--' : n.toLocaleString('de-DE', {maximumFractionDigits: 1}); const meters = [['ZÄHLERSTAND BEZUG', zb, '#E07A5F'], ['ZÄHLERSTAND EINSPEISUNG', ze, '#9FB3C8']]; let b = ''; if (!mob) { tiles.forEach(([t, n, col, sub], i) => { const x = 16 + i * 156, y = 16; b += v.R(x, y, 148, 128, 12, '#18293B', '#24384E', 1) + v.R(x, y, 148, 6, 3, col); b += v.T(x + 14, y + 20, t, 12, '#8AA0B6', 'start', 700); b += v.T(x + 14, y + 44, k(n), 30, col, 'start', 700); b += v.T(x + 14, y + 80, 'kWh', 13, '#9FB3C8', 'start', 600); b += v.T(x + 14, y + 104, sub, 12, '#6E8399'); }); meters.forEach(([t, n, col], i) => { const x = 16 + i * 472, y = 158; b += v.R(x, y, 456, 74, 12, '#18293B', '#24384E', 1) + v.R(x, y, 6, 74, 3, col); b += v.T(x + 20, y + 14, t, 12, '#8AA0B6', 'start', 700); b += v.T(x + 440, y + 15, 'eBZ-Zähler', 11, '#6E8399', 'end'); b += v.T(x + 20, y + 34, fz(n) + `<tspan font-size='14' fill='#9FB3C8' font-weight='600'> kWh</tspan>`, 26, '#FFFFFF', 'start', 700); }); return v.SVG(960, 246, b); } tiles.forEach(([t, n, col, sub], i) => { const x = 16 + (i % 2) * 192, y = 12 + Math.floor(i / 2) * 100; b += v.R(x, y, 176, 90, 12, '#18293B', '#24384E', 1) + v.R(x, y, 6, 90, 3, col); b += v.T(x + 18, y + 12, t, 11, '#8AA0B6', 'start', 700); b += v.T(x + 18, y + 32, k(n) + `<tspan font-size='13' fill='#9FB3C8' font-weight='600'> kWh</tspan>`, 24, col, 'start', 700); b += v.T(x + 18, y + 66, sub, 11, '#6E8399'); }); meters.forEach(([t, n, col], i) => { const x = 16 + i * 192, y = 312; b += v.R(x, y, 176, 90, 12, '#18293B', '#24384E', 1) + v.R(x, y, 6, 90, 3, col); b += v.T(x + 18, y + 12, t, 10, '#8AA0B6', 'start', 700); b += v.T(x + 18, y + 32, fz(n) + `<tspan font-size='12' fill='#9FB3C8' font-weight='600'> kWh</tspan>`, 20, '#FFFFFF', 'start', 700); b += v.T(x + 18, y + 66, 'eBZ-Zähler', 11, '#6E8399'); }); return v.SVG(400, 414, b); ]]]"
  vic_mppt:
    template: vic_base
    custom_fields:
      svg: "[[[ const v = variables; const mob = v.m; const p = 'sensor.victron_solarcharger_'; const s = v.id; const raw = v.st(p + 'state_' + s); const up = raw.toUpperCase(); const on = !['OFF', 'UNAVAILABLE', 'UNKNOWN'].includes(up); const pillBg = up === 'FAULT' ? '#E5484D' : (on ? '#F7AB3E' : '#2B3B4C'); const pillFg = on || up === 'FAULT' ? '#0F1A26' : '#9FB3C8'; const led = up === 'FLOAT' ? '#3CCF5A' : '#F7AB3E'; const tr = [0, 1, 2, 3].map(i => v.num(p + 'tracker_' + i + '_pv_power_' + s)); let b = ''; b += v.T(16, 14, v.name, mob ? 17 : 18, '#FFFFFF', 'start', 700); b += v.T(16, 36, 'Instanz ' + s, 11, '#6E8399'); b += v.PILL(384, 12, v.DE(raw), pillBg, pillFg); const alS = [v.st(p + 'alarm_' + s), v.st(p + 'alarm_highvoltage_' + s), v.st(p + 'alarm_lowvoltage_' + s)].map(x => x.toUpperCase()); const ec = v.st(p + 'errorcode_' + s).toUpperCase(); const lvl = (alS.includes('ALARM') || !['NONE', '0', 'UNKNOWN', 'UNAVAILABLE', 'NONDECODABLE'].includes(ec)) ? 2 : (alS.includes('WARNING') ? 1 : 0); b += v.BELL(186, 24, lvl); b += v.PWR(202, 12, v.st('select.victron_solarcharger_mode_' + s).toUpperCase() === 'ON'); const x0 = mob ? 118 : 145; const row = (y, key, val) => { b += v.T(x0, y, key, 11, '#8AA0B6', 'start', 600); b += v.T(384, y - 2, val, mob ? 14 : 15, '#FFFFFF', 'end', 600); }; if (mob) { b += `<g transform='translate(16,52) scale(0.76)'>` + v.MPPT(0, 0, on, led) + `</g>`; } else { b += v.MPPT(16, 60, on, led); } const yb = mob ? 52 : 60; b += v.T(x0, yb, 'PV-LEISTUNG', 11, '#8AA0B6', 'start', 600); b += v.T(x0, yb + 16, v.W(v.num(p + 'yield_power_' + s)), mob ? 26 : 30, '#F7AB3E', 'start', 700); const y1 = mob ? 102 : 122, dy = mob ? 22 : 26; row(y1, 'PV', v.f(p + 'pv_voltage_' + s, 1, ' V') + ' · ' + v.f(p + 'pv_current_' + s, 1, ' A')); row(y1 + dy, 'BATTERIE', v.f(p + 'battery_voltage_' + s, 2, ' V') + ' · ' + v.f(p + 'battery_current_' + s, 1, ' A')); row(y1 + 2 * dy, 'ERTRAG HEUTE', v.f(p + 'yield_today_' + s, 2, ' kWh')); row(y1 + 3 * dy, 'MAX