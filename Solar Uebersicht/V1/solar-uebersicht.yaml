fx + 22, hy + 110, 8, 8, 2, '#9AA3AB'); s += `<circle cx='${fx + 26}' cy='${hy + 130}' r='11' fill='${led}' opacity='0.5' filter='url(#glow)'>` + (broken ? `<animate attributeName='opacity' values='0.95;0.15;0.95' dur='1.2s' repeatCount='indefinite'/>` : '') + `</circle>`; s += v.C(fx + 26, hy + 130, 6, led); if (ok || broken) s += v.C(fx + 24, hy + 128, 1.8, '#FFFFFF'); s += v.R(fx + 16, hy + 144, 20, 20, 4, '#C87533'); s += v.C(fx + 26, hy + 154, 4, '#7A4A22'); const label = String(nm[k] || ('Abgang ' + (k + 1))).slice(0, 12); s += v.T(fx + 26, y + 210, label, 10, '#FFFFFF', 'middle', 600); s += v.T(fx + 26, y + 226, broken ? 'DEFEKT' : (ok ? 'OK' : '--'), 10, led, 'middle', 700); }); return s; }; const L3 = ['a', 'b', 'c']; if (!mob) { L3.forEach((L, i) => { b += unit(15 + i * 315, 16, L); }); return v.SVG(960, 262, b); } L3.forEach((L, i) => { b += `<g transform='translate(16,${12 + i * 310}) scale(1.2267)'>` + unit(0, 0, L) + `</g>`; }); return v.SVG(400, 940, b); ]]]"
